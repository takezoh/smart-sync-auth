<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"
    />
    <title>Air Sync - OAuth Redirect</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 480px;
        margin: 80px auto;
        padding: 0 20px;
        color: #333;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
      }
      .message {
        margin: 24px 0;
        line-height: 1.6;
      }
      .error {
        color: #c0392b;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 24px;
        background: #7c3aed;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
      }
      a:hover {
        background: #6d28d9;
      }
      .fallback {
        margin-top: 32px;
        font-size: 0.85rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Air Sync for Obsidian</h1>
    <div id="content"></div>

    <script>
      (function () {
        var REDIRECT_BASE = "obsidian://air-sync-auth";

        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var stateRaw = params.get("state");
        var authorizationError = params.get("error");
        var content = document.getElementById("content");

        function showError(msg) {
          content.textContent = msg;
          content.className = "message error";
        }

        function projectAuthorizationError(error) {
          if (error === "access_denied") return "Authorization was denied.";
          var code = /^[A-Za-z0-9._~-]{1,64}$/.test(error)
            ? error
            : "invalid_error";
          return "Authorization failed (" + code + ").";
        }

        if (!stateRaw) {
          showError(
            "Missing authentication parameters. Please try signing in again from Obsidian.",
          );
          return;
        }

        var state;
        try {
          if (!/^[A-Za-z0-9_-]+$/.test(stateRaw)) {
            throw new Error("Invalid base64url");
          }
          var b64 = stateRaw.replace(/-/g, "+").replace(/_/g, "/");
          var padded = b64 + "=".repeat((4 - (b64.length % 4)) % 4);
          state = JSON.parse(atob(padded));
        } catch (e) {
          showError("Invalid state parameter.");
          return;
        }

        if (
          !state ||
          typeof state !== "object" ||
          Array.isArray(state) ||
          typeof state.app !== "string" ||
          typeof state.nonce !== "string"
        ) {
          showError("Invalid state parameter.");
          return;
        }

        if (authorizationError) {
          showError(projectAuthorizationError(authorizationError));
          return;
        }
        if (!code) {
          showError(
            "Missing authentication parameters. Please try signing in again from Obsidian.",
          );
          return;
        }

        var redirectUri =
          REDIRECT_BASE +
          "?code=" +
          encodeURIComponent(code) +
          "&state=" +
          encodeURIComponent(stateRaw);

        content.innerHTML =
          '<p class="message">Redirecting to ' +
          "Obsidian" +
          "…</p>" +
          '<div class="fallback">' +
          "<p>If it doesn't open automatically, click the button below.</p>" +
          '<a href="' +
          redirectUri +
          '">Open ' +
          "Obsidian" +
          "</a>" +
          "</div>";

        window.location.href = redirectUri;
      })();
    </script>
  </body>
</html>
